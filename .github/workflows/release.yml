name: Windows release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Require Windows code-signing secrets
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WIN_CSC_LINK)) { throw "Missing WIN_CSC_LINK GitHub secret." }
          if ([string]::IsNullOrWhiteSpace($env:WIN_CSC_KEY_PASSWORD)) { throw "Missing WIN_CSC_KEY_PASSWORD GitHub secret." }
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install media tools
        shell: powershell
        run: |
          choco install ffmpeg -y --no-progress
          npm run sync:assets
      - name: Verify tag matches package version
        shell: powershell
        run: |
          $packageVersion = (Get-Content package.json | ConvertFrom-Json).version
          if ("v$packageVersion" -ne "${{ github.ref_name }}") { throw "Git tag does not match package.json version." }
      - run: npm run verify
      - run: npx electron-builder --win nsis --publish never
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - name: Verify Authenticode signatures
        shell: pwsh
        run: |
          $targets = @()
          $targets += Get-ChildItem -Path release -File -Filter '*-Setup.exe'
          $targets += Get-ChildItem -Path release\win-unpacked -File -Filter '*.exe'
          if ($targets.Count -lt 2) { throw "Signed installer or packaged app executable was not found." }
          foreach ($target in $targets) {
            $signature = Get-AuthenticodeSignature -FilePath $target.FullName
            if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
              throw "Invalid Authenticode signature: $($target.FullName) [$($signature.Status)]"
            }
            Write-Output "Verified signature: $($target.Name) / $($signature.SignerCertificate.Subject)"
          }
      - name: Create checksums
        shell: powershell
        run: Get-FileHash release\*.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $([IO.Path]::GetFileName($_.Path))" } | Set-Content release\SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ contains(github.ref_name, 'beta') }}
          files: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
            release/SHA256SUMS.txt
