name: Windows release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Determine Windows signing mode
        id: signing
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          $hasLink = -not [string]::IsNullOrWhiteSpace($env:WIN_CSC_LINK)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:WIN_CSC_KEY_PASSWORD)
          if ($hasLink -ne $hasPassword) {
            throw "WIN_CSC_LINK and WIN_CSC_KEY_PASSWORD must either both be set or both be empty."
          }
          if ($hasLink) {
            "enabled=true" >> $env:GITHUB_OUTPUT
            Write-Output "A trusted certificate is configured; this release will be signed."
          } else {
            "enabled=false" >> $env:GITHUB_OUTPUT
            Write-Warning "No code-signing certificate is configured; publishing an unsigned beta release."
          }
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install media tools
        shell: powershell
        run: |
          choco install ffmpeg -y --no-progress
          npm run sync:assets
      - name: Verify tag matches package version
        shell: powershell
        run: |
          $packageVersion = (Get-Content package.json | ConvertFrom-Json).version
          if ("v$packageVersion" -ne "${{ github.ref_name }}") { throw "Git tag does not match package.json version." }
      - run: npm run verify
      - run: npx electron-builder --win nsis --publish never
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - name: Verify Authenticode signatures
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $targets = @()
          $targets += Get-ChildItem -Path release -File -Filter '*-Setup.exe'
          $targets += Get-ChildItem -Path release\win-unpacked -File -Filter '*.exe'
          if ($targets.Count -lt 2) { throw "Signed installer or packaged app executable was not found." }
          foreach ($target in $targets) {
            $signature = Get-AuthenticodeSignature -FilePath $target.FullName
            if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
              throw "Invalid Authenticode signature: $($target.FullName) [$($signature.Status)]"
            }
            Write-Output "Verified signature: $($target.Name) / $($signature.SignerCertificate.Subject)"
          }
      - name: Verify unsigned beta artifacts
        if: steps.signing.outputs.enabled != 'true'
        shell: pwsh
        run: |
          $targets = @()
          $targets += Get-ChildItem -Path release -File -Filter '*-Setup.exe'
          $targets += Get-ChildItem -Path release\win-unpacked -File -Filter '*.exe'
          if ($targets.Count -lt 2) { throw "Installer or packaged app executable was not found." }
          foreach ($target in $targets) {
            $signature = Get-AuthenticodeSignature -FilePath $target.FullName
            if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::NotSigned) {
              throw "Expected an unsigned beta artifact: $($target.FullName) [$($signature.Status)]"
            }
            Write-Warning "Verified unsigned beta artifact: $($target.Name)"
          }
      - name: Create checksums
        shell: powershell
        run: Get-FileHash release\*.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $([IO.Path]::GetFileName($_.Path))" } | Set-Content release\SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ contains(github.ref_name, 'beta') }}
          files: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
            release/SHA256SUMS.txt
