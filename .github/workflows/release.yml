name: Windows release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install media tools
        shell: powershell
        run: |
          choco install ffmpeg -y --no-progress
          npm run sync:assets
      - name: Verify tag matches package version
        shell: powershell
        run: |
          $packageVersion = (Get-Content package.json | ConvertFrom-Json).version
          if ("v$packageVersion" -ne "${{ github.ref_name }}") { throw "Git tag does not match package.json version." }
      - run: npm run verify
      - run: npx electron-builder --win nsis --publish never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      - name: Create checksums
        shell: powershell
        run: Get-FileHash release\*.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $([IO.Path]::GetFileName($_.Path))" } | Set-Content release\SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, 'beta') }}
          files: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
            release/SHA256SUMS.txt
